name: Reusable TypeScript/Node CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install pnpm + Node.js via devEngines.runtime
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Run Biome Check (Lint & Format)
        run: pnpm biome check --error-on-warnings .

      - name: Typecheck (tsc)
        run: pnpm tsc --noEmit

      - name: Run Unit & Integration Tests (Vitest)
        run: pnpm vitest run --coverage.enabled=false

      - name: Build Application
        run: pnpm build
