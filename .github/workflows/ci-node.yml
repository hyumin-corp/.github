name: Reusable TypeScript/Node CI

on:
  workflow_call:
    inputs:
      test-command:
        description: "Comando completo para executar os testes (ex: 'pnpm vitest run'). Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""
      build-command:
        description: "Comando completo para executar o build (ex: 'pnpm build'). Se vazio, a etapa é ignorada."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install pnpm + Node.js via devEngines.runtime
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Run Biome Check (Lint & Format)
        run: pnpm biome check --error-on-warnings .

      - name: Typecheck (tsc)
        run: pnpm tsc --noEmit

      - name: Run Tests
        if: ${{ inputs.test-command != '' }}
        run: ${{ inputs.test-command }}

      - name: Run Build Command
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}
